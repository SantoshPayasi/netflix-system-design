spring:
    application:
        name: content-service
    datasource:
        url: postgresql://myuser:mypassword@localhost:5432/netflix-db?schema=public
        username: myuser
        password: mypassword
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8081

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,env,beans,loggers